[project]
name = "varal-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "django-allauth[headless-spec,socialaccount]>=65,<66",
    "openapi-spec-validator>=0.9.0",
    "pdfplumber==0.11.10",
    "pillow>=10",
    "pywebpush==2.3.0",
    "django-storages[s3]>=1.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "reportlab==5.1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
