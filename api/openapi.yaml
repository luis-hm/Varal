            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Limite de tentativas de aceite (10 por hora).
      security:
      - cookieAuth: []
      summary: Aceitar convite (exige sessão; uso único; 10 tentativas por hora)
