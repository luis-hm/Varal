components:
  examples:
    AllauthAuthenticatedByCode:
      summary: 'Authenticated by code.

        '
      value:
        data:
          methods:
          - at: 1711555057.065702
            email: email@domain.org
            method: code
          user:
            display: Ana
            email: ana@example.com
            has_usable_password: true
            id: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
        meta:
          access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW
          is_authenticated: true
          session_token: ufwcig0zen9skyd545jc0fkq813ghar2
        status: 200
    AllauthAuthenticatedByPassword:
      summary: 'Authenticated by password.

        '
      value:
        data:
          methods:
          - at: 1711555057.065702
            email: email@domain.org
            method: password
          user:
            display: Ana
            email: ana@example.com
            has_usable_password: true
            id: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
        meta:
          access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW
          is_authenticated: true
          session_token: ufwcig0zen9skyd545jc0fkq813ghar2
        status: 200
    AllauthAuthenticatedByPasswordAnd2FA:
      summary: 'Fully authenticated using by password and 2FA.

        '
      value:
        data:
          methods:
          - at: 1711555057.065702
            email: email@domain.org
            method: password
          - at: 1711555060.9375854
            id: 66
            method: mfa
            type: totp
          user:
            display: Ana
            email: ana@example.com
            has_usable_password: true
            id: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
        meta:
          access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW
          is_authenticated: true
          session_token: ufwcig0zen9skyd545jc0fkq813ghar2
        status: 200
    AllauthCannotGenerateRecoveryCodes:
      summary: 'Unable to generate recovery codes.

        '
      value:
        errors:
        - message: 'You cannot deactivate two-factor authentication.

            code: cannot_generate_recovery_codes

            '
        status: 400
    AllauthDisconnectNotAllowedNoPassword:
      summary: Account without a password.
      value:
        errors:
        - code: no_password
          message: Your account has no password set up.
          param: account
        status: 400
    AllauthDisconnectNotAllowedNoVerifiedEmail:
      summary: Account without a verified email.
      value:
        errors:
        - code: no_verified_email
          message: Your account has no verified email address.
          param: account
        status: 400
    AllauthIncorrectPassword:
      value:
        errors:
        - code: incorrect_password
          message: Incorrect password.
          param: password
        status: 400
    AllauthInvalidAuthenticatorCode:
      summary: 'An error response indicating that the provided code is incorrect.

        '
      value:
        errors:
        - code: incorrect_code
          message: Incorrect code.
          param: code
        status: 400
    AllauthInvalidEmail:
      value:
        errors:
        - code: invalid
          message: Enter a valid email address.
          param: email
        status: 400
    AllauthInvalidEmailVerificationKey:
      summary: 'Email verification key invalid.

        '
      value:
        errors:
        - code: invalid
          message: Invalid or expired key.
          param: key
        status: 400
    AllauthInvalidPasswordResetKey:
      summary: 'Password reset key invalid.

        '
      value:
        errors:
        - code: token_invalid
          message: The password reset token was invalid.
          param: key
        status: 400
    AllauthInvalidProviderToken:
      summary: 'Provider token invalid.

        '
      value:
        errors:
        - code: invalid
          message: The token was invalid.
          param: token
        status: 400
    AllauthPasswordMismatch:
      value:
        errors:
        - code: email_password_mismatch
          message: The email address and/or password you specified are not correct.
          param: password
        status: 400
    AllauthReauthenticationRequired:
      summary: 'Reauthentication required

        '
      value:
        data:
          flows:
          - id: reauthenticate
          - id: reauthenticate_by_code
            recipients:
            - email: email@domain.org
          - id: mfa_reauthenticate
          methods:
          - at: 1711555057.065702
            email: email@domain.org
            method: password
          - at: 1711555060.9375854
            id: 66
            method: mfa
            type: totp
          user:
            display: Ana
            email: ana@example.com
            has_usable_password: true
            id: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
        meta:
          is_authenticated: true
        status: 401
    AllauthUnauthenticatedInitial:
      summary: 'Unauthenticated: Initial

        '
      value:
        data:
          flows:
          - id: login
          - id: signup
          - id: provider_redirect
            providers:
            - facebook
            - google
            - telegram
          - id: provider_token
            providers:
            - google
        meta:
          is_authenticated: false
        status: 401
    AllauthUnauthenticatedPending2FA:
      summary: 'Unauthenticated: pending 2FA

        '
      value:
        data:
          flows:
          - id: login
          - id: signup
          - id: provider_redirect
            providers:
            - facebook
            - google
            - telegram
          - id: provider_token
            providers:
            - google
          - id: mfa_authenticate
            is_pending: true
        meta:
          is_authenticated: false
        status: 401
    AllauthUnauthenticatedPendingEmailVerification:
      summary: 'Unauthenticated: pending email verification

        '
      value:
        data:
          flows:
          - id: login
          - id: signup
          - id: provider_redirect
            providers:
            - facebook
            - google
            - telegram
          - id: provider_token
            providers:
            - google
          - id: verify_email
            is_pending: true
        meta:
          is_authenticated: false
        status: 401
    AllauthUnauthenticatedPendingLoginByCode:
      summary: 'Unauthenticated: pending login by code

        '
      value:
        data:
          flows:
          - id: login
          - id: signup
          - id: provider_redirect
            providers:
            - facebook
            - google
            - telegram
          - id: provider_token
            providers:
            - google
          - id: mfa_authenticate
          - id: login_by_code
            is_pending: true
        meta:
          is_authenticated: false
        status: 401
    AllauthUnauthenticatedPendingProviderSignup:
      summary: 'Unauthenticated: pending provider signup

        '
      value:
        data:
          flows:
          - id: login
          - id: signup
          - id: provider_redirect
            providers:
            - facebook
            - google
            - telegram
          - id: provider_token
            providers:
            - google
          - id: provider_signup
            is_pending: true
            provider:
              client_id: 123.apps.googleusercontent.com
              flows:
              - provider_redirect
              - provider_token
              id: google
              name: Google
        meta:
          is_authenticated: false
        status: 401
    AllauthUser:
      value:
        display: Ana
        email: ana@example.com
        has_usable_password: true
        id: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
  parameters:
    AllauthEmailVerificationKey:
      description: The email verification key
      in: header
      name: X-Email-Verification-Key
      required: true
      schema:
        type: string
    AllauthPasswordLess:
      allowEmptyValue: true
      description: 'When present (regardless of its value), enables passwordless sign-in
        via a WebAuthn credential (Passkey),

        which requires PIN, biometric, or equivalent user verification. Omit the parameter
        to disable.

        '
      in: query
      name: passwordless
      required: false
      schema:
        type: boolean
    AllauthPasswordResetKey:
      description: The password reset key
      in: header
      name: X-Password-Reset-Key
      required: true
      schema:
        type: string
  requestBodies:
    AllauthAddWebAuthnAuthenticator:
      content:
        application/json:
          schema:
            properties:
              credential:
                $ref: '#/components/schemas/AllauthWebAuthnCredential'
              name:
                example: Master key
                type: string
            required:
            - credential
            type: object
    AllauthAuthenticateWebAuthn:
      content:
        application/json:
          schema:
            properties:
              credential:
                $ref: '#/components/schemas/AllauthWebAuthnCredential'
            required:
            - credential
            type: object
      description: Authenticate using WebAuthn.
      required: true
    AllauthChangePassword:
      content:
        application/json:
          schema:
            properties:
              current_password:
                $ref: '#/components/schemas/AllauthPassword'
              new_password:
                description: 'The current password.

                  '
                example: Aberto!
                type: string
            required:
            - new_password
            type: object
    AllauthConfirmLoginCode:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthConfirmLoginCode'
      required: true
    AllauthDeleteWebAuthn:
      content:
        application/json:
          schema:
            properties:
              authenticators:
                description: 'The IDs of the authenticator that are to be deleted.

                  '
                items:
                  $ref: '#/components/schemas/AllauthAuthenticatorID'
                type: array
            required:
            - authenticators
            type: object
    AllauthEmail:
      content:
        application/json:
          schema:
            properties:
              email:
                $ref: '#/components/schemas/AllauthEmail'
            required:
            - email
            type: object
    AllauthEndSessions:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthEndSessions'
      required: true
    AllauthLogin:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthLogin'
      description: Login.
      required: true
    AllauthLoginWebAuthn:
      content:
        application/json:
          schema:
            properties:
              credential:
                $ref: '#/components/schemas/AllauthWebAuthnCredential'
            required:
            - credential
            type: object
      description: Login using WebAuthn.
      required: true
    AllauthMFAAuthenticate:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthMFAAuthenticate'
      required: true
    AllauthMFATrust:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthMFATrust'
      required: true
    AllauthMarkPrimaryEmail:
      content:
        application/json:
          schema:
            properties:
              email:
                description: 'An email address.

                  '
                example: email@domain.org
                type: string
              primary:
                description: 'Primary flag.

                  '
                enum:
                - true
                type: boolean
            required:
            - email
            - primary
            type: object
    AllauthPasskeySignup:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthPasskeySignup'
      description: Signup using a passkey
      required: true
    AllauthPhone:
      content:
        application/json:
          schema:
            properties:
              phone:
                example: '+314159265359'
                type: string
            required:
            - phone
            type: object
    AllauthProviderAccount:
      content:
        application/json:
          schema:
            properties:
              account:
                $ref: '#/components/schemas/AllauthProviderAccountID'
              provider:
                $ref: '#/components/schemas/AllauthProviderID'
            required:
            - account
            - provider
            type: object
    AllauthProviderRedirect:
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/AllauthProviderRedirect'
      description: 'Initiate the provider redirect flow.

        '
      required: true
    AllauthProviderSignup:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthProviderSignup'
      description: Provider signup.
      required: true
    AllauthProviderToken:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthProviderToken'
      required: true
    AllauthReauthenticate:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthReauthenticate'
      description: Reauthenticate.
      required: true
    AllauthReauthenticateWebAuthn:
      content:
        application/json:
          schema:
            properties:
              credential:
                $ref: '#/components/schemas/AllauthWebAuthnCredential'
            required:
            - credential
            type: object
      description: Reauthenticate using WebAuthn.
      required: true
    AllauthRefreshToken:
      content:
        application/json:
          schema:
            properties:
              refresh_token:
                $ref: '#/components/schemas/AllauthRefreshToken'
            required:
            - refresh_token
            type: object
    AllauthRequestLoginCode:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthRequestLoginCode'
      description: Request a login code.
      required: true
    AllauthRequestPassword:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthRequestPassword'
      description: Request password.
      required: true
    AllauthRequestReauthenticationCode:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthRequestReauthenticationCode'
      description: Request a reauthentication code.
      required: true
    AllauthResetPassword:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthResetPassword'
    AllauthSetupTOTP:
      content:
        application/json:
          schema:
            properties:
              code:
                $ref: '#/components/schemas/AllauthAuthenticatorCode'
            required:
            - code
            type: object
    AllauthSignup:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthSignup'
      description: Signup
      required: true
    AllauthUpdateWebAuthn:
      content:
        application/json:
          schema:
            properties:
              id:
                $ref: '#/components/schemas/AllauthAuthenticatorID'
              name:
                example: Master key
                type: string
            type: object
    AllauthVerifyEmail:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthVerifyEmail'
    AllauthVerifyPhone:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthVerifyPhone'
  responses:
    AllauthAddAuthenticatorConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthConflictResponse'
      description: 'The account prohibits adding an authenticator, e.g. because of
        an unverified email address.

        '
    AllauthAddWebAuthnAuthenticator:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthWebAuthnAuthenticator'
              meta:
                properties:
                  recovery_codes_generated:
                    description: 'Whether or not recovery codes where generated automatically.

                      '
                    type: boolean
                type: object
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            - meta
            type: object
      description: A WebAuthn authenticator.
    AllauthAuthenticated:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthAuthenticatedResponse'
      description: The user is authenticated.
    AllauthAuthenticatedByCode:
      content:
        application/json:
          examples:
            authenticated:
              $ref: '#/components/examples/AllauthAuthenticatedByCode'
          schema:
            $ref: '#/components/schemas/AllauthAuthenticatedResponse'
      description: 'Authenticated by code.

        '
    AllauthAuthenticatedByPassword:
      content:
        application/json:
          examples:
            authenticated:
              $ref: '#/components/examples/AllauthAuthenticatedByPassword'
          schema:
            $ref: '#/components/schemas/AllauthAuthenticatedResponse'
      description: 'Authenticated by password.

        '
    AllauthAuthenticatedByPasswordAnd2FA:
      content:
        application/json:
          examples:
            authenticated:
              $ref: '#/components/examples/AllauthAuthenticatedByPasswordAnd2FA'
          schema:
            $ref: '#/components/schemas/AllauthAuthenticatedResponse'
      description: 'Authenticated by password and 2FA.

        '
    AllauthAuthentication:
      content:
        application/json:
          examples:
            reauthentication_required:
              $ref: '#/components/examples/AllauthReauthenticationRequired'
            unauthenticated_initial:
              $ref: '#/components/examples/AllauthUnauthenticatedInitial'
            unauthenticated_pending_2fa:
              $ref: '#/components/examples/AllauthUnauthenticatedPending2FA'
            unauthenticated_pending_email_verification:
              $ref: '#/components/examples/AllauthUnauthenticatedPendingEmailVerification'
            unauthenticated_pending_provider_signup:
              $ref: '#/components/examples/AllauthUnauthenticatedPendingProviderSignup'
          schema:
            $ref: '#/components/schemas/AllauthAuthenticationResponse'
      description: Not authenticated.
    AllauthAuthenticationOrReauthentication:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AllauthAuthenticationResponse'
            - $ref: '#/components/schemas/AllauthReauthenticationResponse'
      description: 'The response indicates authentication or re-authentication is
        required.

        '
    AllauthAuthenticators:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthAuthenticatorList'
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'List of authenticators.

        '
    AllauthConfiguration:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthConfigurationResponse'
      description: 'The django-allauth configuration.

        '
    AllauthEmailAddresses:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/AllauthEmailAddress'
                type: array
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'List of email addresses.

        '
    AllauthEmailVerificationInfo:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthEmailVerificationInfo'
      description: Email verification information.
    AllauthError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthErrorResponse'
      description: An input error occurred.
    AllauthForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthForbiddenResponse'
      description: 'A forbidden response.

        '
    AllauthNotFound:
      content:
        application/json:
          schema:
            properties:
              status:
                enum:
                - 404
                type: integer
            required:
            - status
            type: object
      description: 'Not found.

        '
    AllauthPasswordResetInfo:
      content:
        application/json:
          schema:
            properties:
              data:
                properties:
                  user:
                    $ref: '#/components/schemas/AllauthUser'
                type: object
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: Information about the password reset key.
    AllauthPhoneNumbers:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllauthPhoneNumbersResponse'
      description: 'List of phone numbers.

        '
    AllauthProviderAccounts:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/AllauthProviderAccount'
                type: array
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'List of third-party provider accounts.

        '
    AllauthProviderSignup:
      content:
        application/json:
          schema:
            properties:
              data:
                properties:
                  account:
                    $ref: '#/components/schemas/AllauthProviderAccount'
                  email:
                    items:
                      $ref: '#/components/schemas/AllauthEmailAddress'
                    type: array
                  user:
                    $ref: '#/components/schemas/AllauthUser'
                required:
                - email
                - account
                - user
                type: object
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'Information relating to the pending provider signup.

        '
    AllauthReauthenticationRequired:
      content:
        application/json:
          examples:
            reauthentication_required:
              summary: 'Reauthentication required

                '
              value:
                data:
                  flows:
                  - id: reauthenticate
                  - id: reauthenticate_by_code
                    recipients:
                    - email: email@domain.org
                  - id: mfa_reauthenticate
                  methods:
                  - at: 1711555057.065702
                    email: email@domain.org
                    method: password
                  - at: 1711555060.9375854
                    id: 66
                    method: mfa
                    type: totp
                  user:
                    display: Ana
                    email: ana@example.com
                    has_usable_password: true
                    id: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
                meta:
                  is_authenticated: true
                status: 401
          schema:
            $ref: '#/components/schemas/AllauthReauthenticationResponse'
      description: 'The response indicates reauthentication is required.

        '
    AllauthRecoveryCodes:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthSensitiveRecoveryCodesAuthenticator'
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'Information on the recovery codes.

        '
    AllauthRefreshToken:
      content:
        application/json:
          schema:
            properties:
              data:
                properties:
                  access_token:
                    $ref: '#/components/schemas/AllauthAccessToken'
                  refresh_token:
                    $ref: '#/components/schemas/AllauthRefreshToken'
                required:
                - access_token
                type: object
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - data
            - status
            type: object
      description: A new access token (and optionally new refresh token).
    AllauthSessionGone:
      content:
        application/json:
          examples:
            unauth:
              $ref: '#/components/examples/AllauthUnauthenticatedInitial'
          schema:
            $ref: '#/components/schemas/AllauthSessionGoneResponse'
      description: 'The response indicates session is invalid or no longer exists.

        '
    AllauthSessions:
      content:
        application/json:
          schema:
            properties:
              data:
                items:
                  $ref: '#/components/schemas/AllauthSession'
                type: array
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'List of sessions.

        '
    AllauthStatusOK:
      content:
        application/json:
          schema:
            properties:
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            type: object
      description: 'A success response.

        '
    AllauthTOTPAuthenticator:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthTOTPAuthenticator'
              meta:
                properties:
                  recovery_codes_generated:
                    description: Whether or not recovery codes where generated automatically.
                    type: boolean
                type: object
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: 'Information on the TOTP authenticator.

        '
    AllauthTOTPAuthenticatorNotFound:
      content:
        application/json:
          schema:
            properties:
              meta:
                properties:
                  secret:
                    description: 'A TOTP secret that can be used to setup a new authenticator.

                      '
                    example: J4ZKKXTK7NOVU7EPUVY23LCDV4T2QZYM
                    type: string
                  totp_url:
                    description: 'otpauth URI from which a QR code can be generated
                      and scanned by OTP clients.

                      '
                    example: otpauth://totp/Example:alice@fsf.org?secret=JBSWY3DPEHPK3PXP&issuer=Example
                    type: string
                required:
                - secret
                - totp_url
                type: object
              status:
                enum:
                - 404
                type: integer
            required:
            - status
            - meta
            type: object
      description: 'No TOTP authenticator has been set up.

        '
    AllauthTooManyRequests:
      content:
        application/json:
          schema:
            properties:
              status:
                enum:
                - 429
                type: integer
            required:
            - status
            type: object
      description: 'Too many requests.

        '
    AllauthUnauthenticated:
      content:
        application/json:
          examples:
            unauth:
              $ref: '#/components/examples/AllauthUnauthenticatedInitial'
          schema:
            $ref: '#/components/schemas/AllauthAuthenticationResponse'
      description: 'There is no authenticated session.

        '
    AllauthWebAuthnAuthenticator:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthWebAuthnAuthenticator'
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: A WebAuthn authenticator.
    AllauthWebAuthnCreationOptionsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthWebAuthnCredentialCreationOptions'
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: WebAuthn credential creation options.
    AllauthWebAuthnRequestOptionsResponse:
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AllauthWebAuthnCredentialRequestOptions'
              status:
                $ref: '#/components/schemas/AllauthStatusOK'
            required:
            - status
            - data
            type: object
      description: WebAuthn credential request options.
  schemas:
    Aceite:
      properties:
        grupo_id:
          format: uuid
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
      required:
      - grupo_id
      - papel
      type: object
    AllauthAccessToken:
      description: 'The access token.

        '
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW
      type: string
    AllauthAccountConfiguration:
      description: 'Configuration of the Django `allauth.account` app.

        '
      properties:
        email_verification_by_code_enabled:
          type: boolean
        is_open_for_signup:
          type: boolean
        login_by_code_enabled:
          type: boolean
        login_methods:
          items:
            enum:
            - email
            - username
            type: string
          type: array
        password_reset_by_code_enabled:
          type: boolean
      required:
      - authentication_method
      - email_verification_by_code_enabled
      - is_open_for_signup
      - login_by_code_enabled
      type: object
    AllauthAuthenticated:
      properties:
        methods:
          description: 'A list of methods used to authenticate.

            '
          items:
            $ref: '#/components/schemas/AllauthAuthenticationMethod'
          type: array
        user:
          $ref: '#/components/schemas/AllauthUser'
      required:
      - user
      - methods
      type: object
    AllauthAuthenticatedMeta:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseAuthenticationMeta'
      - description: 'Metadata available in an re-authentication related response.

          '
        properties:
          is_authenticated:
            enum:
            - true
            type: boolean
        required:
        - is_authenticated
        type: object
    AllauthAuthenticatedResponse:
      properties:
        data:
          $ref: '#/components/schemas/AllauthAuthenticated'
        meta:
          $ref: '#/components/schemas/AllauthAuthenticationMeta'
        status:
          $ref: '#/components/schemas/AllauthStatusOK'
      required:
      - status
      - data
      - meta
      type: object
    AllauthAuthenticationMeta:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseAuthenticationMeta'
      - description: 'Metadata available in an authentication related response.

          '
        properties:
          is_authenticated:
            type: boolean
        required:
        - is_authenticated
        type: object
    AllauthAuthenticationMethod:
      oneOf:
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          email:
            $ref: '#/components/schemas/AllauthEmail'
          method:
            enum:
            - password
            type: string
          username:
            $ref: '#/components/schemas/AllauthUsername'
        required:
        - method
        - at
        title: 'Authenticated by username/email login

          '
        type: object
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          email:
            $ref: '#/components/schemas/AllauthEmail'
          method:
            enum:
            - password_reset
            type: string
        required:
        - at
        - email
        - method
        title: 'Authenticated after password reset

          '
        type: object
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          email:
            $ref: '#/components/schemas/AllauthEmail'
          method:
            enum:
            - code
            type: string
          reauthenticated:
            enum:
            - true
            type: boolean
        required:
        - at
        - email
        - method
        title: '(Re)authenticated by confirming a code sent by email.

          '
        type: object
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          method:
            enum:
            - code
            type: string
          phone:
            $ref: '#/components/schemas/AllauthPhone'
          reauthenticated:
            enum:
            - true
            type: boolean
        required:
        - at
        - method
        - phone
        title: '(Re)authenticated by confirming a code sent by phone.

          '
        type: object
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          method:
            enum:
            - password
            type: string
          reauthenticated:
            enum:
            - true
            type: boolean
        required:
        - method
        - reauthenticated
        - at
        title: 'Reauthenticated by password

          '
        type: object
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          method:
            enum:
            - socialaccount
            type: string
          provider:
            $ref: '#/components/schemas/AllauthProviderID'
          uid:
            $ref: '#/components/schemas/AllauthProviderAccountID'
        required:
        - method
        - reauthenticated
        - at
        - provider
        - uid
        title: 'Authenticated by third-party provider

          '
        type: object
      - properties:
          at:
            $ref: '#/components/schemas/AllauthTimestamp'
          method:
            enum:
            - mfa
            type: string
          reauthenticated:
            type: boolean
          type:
            $ref: '#/components/schemas/AllauthAuthenticatorType'
        required:
        - method
        - at
        - type
        title: '(Re)authenticated by 2FA

          '
        type: object
    AllauthAuthenticationResponse:
      description: 'An authentication related response.

        '
      properties:
        data:
          properties:
            flows:
              items:
                $ref: '#/components/schemas/AllauthFlow'
              type: array
          required:
          - flows
          type: object
        meta:
          $ref: '#/components/schemas/AllauthAuthenticationMeta'
        status:
          enum:
          - 401
          type: integer
      required:
      - status
      - data
      - meta
      type: object
    AllauthAuthenticatorCode:
      description: 'An authenticator code.

        '
      example: '314159'
      type: string
    AllauthAuthenticatorID:
      description: 'Authenticator ID.

        '
      example: 123
      type: integer
    AllauthAuthenticatorList:
      items:
        oneOf:
        - $ref: '#/components/schemas/AllauthTOTPAuthenticator'
        - $ref: '#/components/schemas/AllauthRecoveryCodesAuthenticator'
        - $ref: '#/components/schemas/AllauthWebAuthnAuthenticator'
      type: array
    AllauthAuthenticatorType:
      description: 'The type of authenticator.

        '
      enum:
      - recovery_codes
      - totp
      - webauthn
      type: string
    AllauthBaseAuthenticationMeta:
      properties:
        access_token:
          description: 'The access token (`app` clients only).

            '
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdW
          type: string
        session_token:
          description: 'The session token (`app` clients only).

            '
          example: ufwcig0zen9skyd545jc0fkq813ghar2
          type: string
      type: object
    AllauthBaseAuthenticator:
      properties:
        created_at:
          $ref: '#/components/schemas/AllauthTimestamp'
        last_used_at:
          $ref: '#/components/schemas/AllauthOptionalTimestamp'
      required:
      - created_at
      - last_used_at
      type: object
    AllauthBaseSignup:
      properties:
        email:
          $ref: '#/components/schemas/AllauthEmail'
      required:
      - email
      type: object
    AllauthClientID:
      description: 'The client ID (in case of OAuth2 or OpenID Connect based providers)

        '
      example: 123.apps.googleusercontent.com
      type: string
    AllauthCode:
      description: 'An one-time code.

        '
      example: NQ3TM5
      type: string
    AllauthConfigurationResponse:
      example:
        data:
          account:
            authentication_method: email
          mfa:
            supported_types:
            - recovery_codes
            - totp
          socialaccount:
            providers:
            - client_id: 123.apps.googleusercontent.com
              flows:
              - provider_redirect
              - provider_token
              id: google
              name: Google
              openid_configuration_url: https://accounts.google.com/.well-known/openid-configuration
          usersessions:
            track_activity: false
        status: 200
      properties:
        data:
          properties:
            account:
              $ref: '#/components/schemas/AllauthAccountConfiguration'
            mfa:
              $ref: '#/components/schemas/AllauthMFAConfiguration'
            socialaccount:
              $ref: '#/components/schemas/AllauthSocialAccountConfiguration'
            usersessions:
              $ref: '#/components/schemas/AllauthUserSessionsConfiguration'
          required:
          - account
          type: object
        status:
          $ref: '#/components/schemas/AllauthStatusOK'
      required:
      - status
      - data
      type: object
    AllauthConfirmLoginCode:
      properties:
        code:
          $ref: '#/components/schemas/AllauthCode'
      required:
      - code
      type: object
    AllauthConflictResponse:
      properties:
        status:
          enum:
          - 409
          type: integer
      required:
      - status
      type: object
    AllauthEmail:
      description: 'The email address.

        '
      example: email@domain.org
      type: string
    AllauthEmailAddress:
      properties:
        email:
          $ref: '#/components/schemas/AllauthEmail'
        primary:
          example: true
          type: boolean
        verified:
          example: false
          type: boolean
      required:
      - email
      - primary
      - verified
      type: object
    AllauthEmailVerificationInfo:
      properties:
        data:
          properties:
            email:
              $ref: '#/components/schemas/AllauthEmail'
            user:
              $ref: '#/components/schemas/AllauthUser'
          required:
          - email
          - user
          type: object
        meta:
          properties:
            is_authenticating:
              type: boolean
          required:
          - is_authenticating
          type: object
        status:
          $ref: '#/components/schemas/AllauthStatusOK'
      required:
      - status
      - data
      - meta
      type: object
    AllauthEndSessions:
      properties:
        sessions:
          description: 'The IDs of the sessions that are to be ended.

            '
          items:
            example: 123
            type: integer
          type: array
      required:
      - sessions
      type: object
    AllauthErrorResponse:
      properties:
        errors:
          items:
            properties:
              code:
                description: 'An error code.

                  '
                example: invalid
                type: string
              message:
                description: 'A human readable error message.

                  '
                example: Enter a valid email address.
                type: string
              param:
                description: 'The name of the input parameter that was incorrect.

                  '
                example: email
                type: string
            required:
            - code
            - message
            type: object
          type: array
        status:
          enum:
          - 400
          example: 400
          type: integer
      type: object
    AllauthFlow:
      properties:
        id:
          enum:
          - login
          - login_by_code
          - mfa_authenticate
          - mfa_reauthenticate
          - provider_redirect
          - provider_signup
          - provider_token
          - reauthenticate
          - reauthenticate_by_code
          - signup
          - verify_email
          - verify_phone
          type: string
        is_pending:
          enum:
          - true
          type: boolean
        provider:
          $ref: '#/components/schemas/AllauthProvider'
        recipients:
          description: 'Verified destinations that can receive a reauthentication
            code.

            '
          items:
            $ref: '#/components/schemas/AllauthReauthenticationCodeRecipient'
          type: array
        types:
          description: Matches `settings.MFA_SUPPORTED_TYPES`.
          items:
            $ref: '#/components/schemas/AllauthAuthenticatorType'
          type: array
      required:
      - id
      type: object
    AllauthForbiddenResponse:
      properties:
        status:
          enum:
          - 403
          type: integer
      required:
      - status
      type: object
    AllauthLogin:
      allOf:
      - properties:
          password:
            $ref: '#/components/schemas/AllauthPassword'
        required:
        - password
        type: object
      - anyOf:
        - properties:
            username:
              $ref: '#/components/schemas/AllauthUsername'
          required:
          - username
          title: Login by username
        - properties:
            email:
              $ref: '#/components/schemas/AllauthEmail'
          required:
          - email
          title: Login by email
        - properties:
            phone:
              $ref: '#/components/schemas/AllauthPhone'
          required:
          - phone
          title: Login by phone
    AllauthMFAAuthenticate:
      properties:
        code:
          $ref: '#/components/schemas/AllauthAuthenticatorCode'
      required:
      - code
      type: object
    AllauthMFAConfiguration:
      description: 'Configuration of the Django `allauth.mfa` app.

        '
      properties:
        supported_types:
          description: 'Matches `settings.MFA_SUPPORTED_TYPES`.

            '
          items:
            $ref: '#/components/schemas/AllauthAuthenticatorType'
          type: array
      required:
      - supported_types
      type: object
    AllauthMFATrust:
      properties:
        trust:
          type: boolean
      required:
      - trust
      type: object
    AllauthOptionalTimestamp:
      $ref: '#/components/schemas/AllauthTimestamp'
      nullable: true
    AllauthPasskeySignup:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseSignup'
    AllauthPassword:
      description: 'The password.

        '
      example: Alohomora!
      type: string
    AllauthPhone:
      description: 'The phone number.

        '
      example: '+314159265359'
      type: string
    AllauthPhoneNumber:
      description: 'A phone number.

        '
      properties:
        phone:
          example: '+314159265359'
          type: string
        verified:
          type: boolean
      required:
      - phone
      - verified
      type: object
    AllauthPhoneNumberChangeResponse:
      example:
        data:
        - phone: '+314159265359'
          verified: false
        status: 202
      properties:
        data:
          items:
            $ref: '#/components/schemas/AllauthPhoneNumber'
          type: array
        status:
          $ref: '#/components/schemas/AllauthStatusAccepted'
      required:
      - status
      - data
      type: object
    AllauthPhoneNumbersResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AllauthPhoneNumber'
          type: array
        status:
          $ref: '#/components/schemas/AllauthStatusOK'
      required:
      - status
      - data
      type: object
    AllauthProcess:
      description: 'The process to be executed when the user successfully

        authenticates. When set to `login`, the user will be logged into the

        account to which the provider account is connected, or if no such

        account exists, a signup will occur. If set to `connect`, the provider

        account will be connected to the list of provider accounts for the

        currently authenticated user.

        '
      enum:
      - login
      - connect
      example: login
      type: string
    AllauthProvider:
      properties:
        client_id:
          description: 'The client ID (in case of OAuth2 or OpenID Connect based providers)

            '
          example: 123.apps.googleusercontent.com
          type: string
        flows:
          description: 'The authentication flows the provider integration supports.

            '
          items:
            enum:
            - provider_redirect
            - provider_token
            type: string
          type: array
        id:
          description: 'The provider ID.

            '
          example: google
          type: string
        name:
          description: 'The name of the provider.

            '
          example: Google
          type: string
        openid_configuration_url:
          description: 'The OIDC discovery or well-known URL (in case of OAuth2 or
            OpenID Connect based providers)

            '
          example: https://accounts.google.com/.well-known/openid-configuration
          type: string
      required:
      - id
      - name
      - flows
      type: object
    AllauthProviderAccount:
      properties:
        display:
          description: 'A name derived from the third-party provider account data.

            '
          example: Wizzkid
          type: string
        provider:
          $ref: '#/components/schemas/AllauthProvider'
        uid:
          $ref: '#/components/schemas/AllauthProviderAccountID'
      required:
      - uid
      - provider
      - display
      type: object
    AllauthProviderAccountID:
      description: 'The provider specific account ID.

        '
      example: goo12345
      type: string
    AllauthProviderID:
      description: 'The provider ID.

        '
      example: google
      type: string
    AllauthProviderList:
      items:
        $ref: '#/components/schemas/AllauthProvider'
      type: array
    AllauthProviderRedirect:
      properties:
        callback_url:
          description: "The URL to return to after the redirect flow is complete.\n\
            \nNote that this is not to be mistaken with the callback URL that you\n\
            configure over at the OAuth provider during the OAuth app/client\nsetup.\
            \ The flow is as follows:\n\n  1. Your frontend redirects to the headless\
            \ provider redirect\n     endpoint in a synchronous (non-XHR) manner,\
            \ informing allauth\n     (by means of `callback_url`) where to redirect\
            \ to after the\n     provider handshake is completed.\n\n  2. Headless\
            \ will redirect to the (OAuth) identity provider to\n     initiate the\
            \ handshake, passing along a different callback URL\n     to the provider:\
            \ one that points to an allauth backend URL.\n     This is the URL that\
            \ you need to have setup at your OAuth\n     app/client configuration.\
            \ Note that this must be a backend URL\n     as providers can use POST\
            \ requests to perform their callbacks,\n     which is something a frontend\
            \ would not be able to handle.\n\n  3. After the authorization at the\
            \ provider is completed, the\n     provider redirects to the *backend*\
            \ allauth callback URL, which\n     will then redirect back to the *frontend*\
            \ callback URL.\n\n  4. Your frontend is now expected to fetch the current\
            \ session to\n     determine what the next course of action is. The user\
            \ could be\n     authenticated at this point, or another flow is pending\n\
            \     (e.g. email verification, or, provider signup). In case of\n   \
            \  errors a `?error=` is passed to the frontend callback URL.\n"
          example: https://app.project.org/account/provider/callback
          type: string
        process:
          $ref: '#/components/schemas/AllauthProcess'
        provider:
          $ref: '#/components/schemas/AllauthProviderID'
      required:
      - provider
      - process
      - callback_url
      type: object
    AllauthProviderSignup:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseSignup'
    AllauthProviderToken:
      properties:
        process:
          $ref: '#/components/schemas/AllauthProcess'
        provider:
          $ref: '#/components/schemas/AllauthProviderID'
        token:
          description: 'The token.

            '
          properties:
            access_token:
              description: 'The access token.

                '
              example: 36POk6yJV_adQs
              type: string
            client_id:
              $ref: '#/components/schemas/AllauthClientID'
            id_token:
              description: 'The ID token.

                '
              example: eyJhbGciOiJI
              type: string
          required:
          - client_id
          type: object
      required:
      - provider
      - process
      - token
      type: object
    AllauthReauthenticate:
      properties:
        password:
          $ref: '#/components/schemas/AllauthPassword'
      required:
      - password
      type: object
    AllauthReauthenticationCodeRecipient:
      oneOf:
      - additionalProperties: false
        properties:
          email:
            $ref: '#/components/schemas/AllauthEmail'
        required:
        - email
        title: Email recipient
        type: object
      - additionalProperties: false
        properties:
          phone:
            $ref: '#/components/schemas/AllauthPhone'
        required:
        - phone
        title: Phone recipient
        type: object
    AllauthReauthenticationRequired:
      properties:
        flows:
          items:
            $ref: '#/components/schemas/AllauthFlow'
          type: array
        methods:
          description: 'A list of methods used to authenticate.

            '
          items:
            $ref: '#/components/schemas/AllauthAuthenticationMethod'
          type: array
        user:
          $ref: '#/components/schemas/AllauthUser'
      required:
      - flows
      - user
      - methods
      type: object
    AllauthReauthenticationResponse:
      description: 'A response indicating reauthentication is required.

        '
      properties:
        data:
          $ref: '#/components/schemas/AllauthReauthenticationRequired'
        meta:
          $ref: '#/components/schemas/AllauthAuthenticatedMeta'
        status:
          enum:
          - 401
          type: integer
      required:
      - status
      - data
      - meta
      type: object
    AllauthRecoveryCodesAuthenticator:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseAuthenticator'
      - properties:
          total_code_count:
            description: 'The total number of recovery codes that initially were available.

              '
            example: 10
            type: integer
          type:
            description: 'The authenticator type.

              '
            enum:
            - recovery_codes
            type: string
          unused_code_count:
            description: 'The number of recovery codes that are unused.

              '
            example: 7
            type: integer
        required:
        - type
        - total_code_count
        - unused_code_count
        type: object
    AllauthRefreshToken:
      description: 'The refresh token.

        '
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.QV30
      type: string
    AllauthRequestLoginCode:
      anyOf:
      - properties:
          phone:
            $ref: '#/components/schemas/AllauthPhone'
        required:
        - phone
        title: Request login code (phone)
      - properties:
          email:
            $ref: '#/components/schemas/AllauthEmail'
        required:
        - email
        title: Request login code (email)
      type: object
    AllauthRequestPassword:
      properties:
        email:
          $ref: '#/components/schemas/AllauthEmail'
      required:
      - email
      type: object
    AllauthRequestReauthenticationCode:
      oneOf:
      - additionalProperties: false
        properties:
          phone:
            $ref: '#/components/schemas/AllauthPhone'
        required:
        - phone
        title: Request reauthentication code by phone
        type: object
      - additionalProperties: false
        properties:
          email:
            $ref: '#/components/schemas/AllauthEmail'
        required:
        - email
        title: Request reauthentication code by email
        type: object
      type: object
    AllauthResetPassword:
      properties:
        key:
          description: The password reset key
          example: 2f-c4nqd4-e07d9bc694f9f28cd4fe92569d495333
          type: string
        password:
          $ref: '#/components/schemas/AllauthPassword'
      required:
      - key
      - password
      type: object
    AllauthSensitiveRecoveryCodesAuthenticator:
      allOf:
      - $ref: '#/components/schemas/AllauthRecoveryCodesAuthenticator'
      - properties:
          unused_codes:
            description: 'The list of unused codes.

              '
            items:
              $ref: '#/components/schemas/AllauthAuthenticatorCode'
            type: array
        required:
        - unused_codes
        type: object
    AllauthSession:
      properties:
        created_at:
          $ref: '#/components/schemas/AllauthTimestamp'
        id:
          example: 123
          type: integer
        ip:
          example: 127.2.3.192
          type: string
        is_current:
          type: boolean
        last_seen_at:
          $ref: '#/components/schemas/AllauthTimestamp'
        user_agent:
          example: Mozilla Firefox
          type: string
      required:
      - user_agent
      - ip
      - created_at
      - is_current
      - id
      type: object
    AllauthSessionGoneResponse:
      description: 'The session is expired or invalid.

        '
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/AllauthAuthenticationMeta'
        status:
          enum:
          - 410
          type: integer
      required:
      - status
      - data
      - meta
      type: object
    AllauthSignup:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseSignup'
      - properties:
          password:
            $ref: '#/components/schemas/AllauthPassword'
        required:
        - password
        type: object
    AllauthSocialAccountConfiguration:
      description: 'Configuration of the Django `allauth.socialaccount` app.

        '
      properties:
        providers:
          $ref: '#/components/schemas/AllauthProviderList'
      required:
      - providers
      type: object
    AllauthStatusAccepted:
      enum:
      - 202
      type: integer
    AllauthStatusOK:
      enum:
      - 200
      type: integer
    AllauthTOTPAuthenticator:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseAuthenticator'
      - properties:
          type:
            enum:
            - totp
            type: string
        required:
        - type
        type: object
    AllauthTimestamp:
      description: 'An epoch based timestamp (trivial to parse using: `new Date(value)*1000`)

        '
      example: 1711555057.065702
      type: number
    AllauthUser:
      properties:
        display:
          description: Display name
          example: Ana
          type: string
        email:
          description: Email
          example: ana@example.com
          type: string
        has_usable_password:
          description: Password configured
          example: true
          type: boolean
        id:
          description: User UUID
          example: 6fd32f1c-6f80-4b01-b491-25aeb00a180e
          type: string
      required:
      - id
      - display
      - has_usable_password
      type: object
    AllauthUserSessionsConfiguration:
      description: 'Configuration of the Django `allauth.usersessions` app.

        '
      properties:
        track_activity:
          description: 'Matches `settings.USERSESSIONS_TRACK_ACTIVITY`.

            '
          type: boolean
      required:
      - track_activity
      type: object
    AllauthUsername:
      description: 'The username.

        '
      example: wizard
      type: string
    AllauthVerifyEmail:
      properties:
        key:
          description: The email verification key
          example: 2f-c4nqd4-e07d9bc694f9f28cd4fe92569d495333
          type: string
      required:
      - key
      type: object
    AllauthVerifyPhone:
      properties:
        code:
          description: The phone verification code
          example: 4S3H82
          type: string
      required:
      - code
      type: object
    AllauthWebAuthnAuthenticator:
      allOf:
      - $ref: '#/components/schemas/AllauthBaseAuthenticator'
      - properties:
          id:
            $ref: '#/components/schemas/AllauthAuthenticatorID'
          is_passwordless:
            description: 'Whether or not this authenticator represents a passkey.
              Absent if it is not specified.

              '
            type: boolean
          name:
            example: Master key
            type: string
          type:
            enum:
            - webauthn
            type: string
        required:
        - type
        - id
        - name
        type: object
    AllauthWebAuthnCredential:
      example:
        credential:
          authenticatorAttachment: cross-platform
          clientExtensionResults: {}
          id: -J4JNfPfnLyRSMK4R...
          rawId: -J4JNfPfnLyRSMK4R...
          response:
            authenticatorData: SZYN5YgO...
            clientDataJSON: eyJjaGFsbGVuZ2UiOi...
            signature: MEUCIE-7sqILygPqGbrRZ4j2nqeqUU...
            userHandle: Mg...
          type: public-key
      type: object
    AllauthWebAuthnCredentialCreationOptions:
      properties:
        creation_options:
          example:
            data:
              request_options:
                publicKey:
                  allowCredentials: []
                  challenge: aOecJJtLA2e-Dj2WU-zbRoJewbQqSUPxoA9EzsUL72o
                  rpId: localhost
                  userVerification: preferred
            status: 200
          type: object
      required:
      - creation_options
      type: object
    AllauthWebAuthnCredentialRequestOptions:
      properties:
        request_options:
          example:
            data:
              request_options:
                publicKey:
                  allowCredentials: []
                  challenge: aOecJJtLA2e-Dj2WU-zbRoJewbQqSUPxoA9EzsUL72o
                  rpId: localhost
                  userVerification: preferred
            status: 200
          type: object
      required:
      - request_options
      type: object
    Casa:
      properties:
        arquivado:
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        nome:
          maxLength: 150
          type: string
      required:
      - id
      - nome
      type: object
    ConviteCriado:
      properties:
        expira_em:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
        url:
          format: uri
          type: string
      required:
      - expira_em
      - id
      - papel
      - url
      type: object
    ConvitePendente:
      properties:
        criado_em:
          format: date-time
          type: string
        criado_por_nome:
          nullable: true
          readOnly: true
          type: string
        expira_em:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
      required:
      - criado_em
      - criado_por_nome
      - expira_em
      - id
      - papel
      type: object
    ConvitePublico:
      properties:
        expira_em:
          format: date-time
          type: string
        grupo_nome:
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
      required:
      - expira_em
      - grupo_nome
      - papel
      type: object
    CriarGrupo:
      properties:
        casas:
          items:
            maxLength: 150
            type: string
          maxItems: 20
          type: array
        nome:
          maxLength: 150
          type: string
      required:
      - nome
      type: object
    Erro:
      properties:
        detail:
          type: string
      required:
      - detail
      type: object
    EspacoPessoal:
      properties:
        id:
          format: uuid
          readOnly: true
          type: string
        nome:
          maxLength: 150
          type: string
        tipo:
          $ref: '#/components/schemas/TipoEnum'
      required:
      - id
      - nome
      - tipo
      type: object
    GrupoDetalhe:
      properties:
        casas:
          items:
            $ref: '#/components/schemas/Casa'
          readOnly: true
          type: array
        id:
          format: uuid
          type: string
        membros:
          items:
            $ref: '#/components/schemas/Membro'
          readOnly: true
          type: array
        meu_papel:
          $ref: '#/components/schemas/PapelEnum'
        nome:
          type: string
      required:
      - casas
      - id
      - membros
      - meu_papel
      - nome
      type: object
    GrupoLista:
      properties:
        casas_qtd:
          nullable: true
          type: integer
        id:
          format: uuid
          type: string
        membros_qtd:
          nullable: true
          type: integer
        nome:
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
      required:
      - casas_qtd
      - id
      - membros_qtd
      - nome
      - papel
      type: object
    GrupoResumo:
      properties:
        id:
          format: uuid
          type: string
        nome:
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
      required:
      - id
      - nome
      - papel
      type: object
    Health:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    Me:
      properties:
        email:
          format: email
          type: string
        espaco_pessoal:
          $ref: '#/components/schemas/EspacoPessoal'
        grupos:
          items:
            $ref: '#/components/schemas/GrupoResumo'
          type: array
        id:
          format: uuid
          type: string
        nome:
          type: string
      required:
      - email
      - espaco_pessoal
      - grupos
      - id
      - nome
      type: object
    Membro:
      properties:
        email:
          nullable: true
          readOnly: true
          type: string
        id:
          format: uuid
          readOnly: true
          type: string
        nome:
          readOnly: true
          type: string
        papel:
          $ref: '#/components/schemas/PapelEnum'
        sou_eu:
          readOnly: true
          type: boolean
      required:
      - email
      - id
      - nome
      - papel
      - sou_eu
      type: object
    Papel:
      properties:
        papel:
          $ref: '#/components/schemas/PapelEnum'
      required:
      - papel
      type: object
    PapelEnum:
      description: '* `admin` - Admin

        * `membro` - Membro

        * `pagador` - Pagador

        * `observador` - Observador'
      enum:
      - admin
      - membro
      - pagador
      - observador
      type: string
    PatchedCasa:
      properties:
        arquivado:
          type: boolean
        id:
          format: uuid
          readOnly: true
          type: string
        nome:
          maxLength: 150
          type: string
      type: object
    PatchedPapel:
      properties:
        papel:
          $ref: '#/components/schemas/PapelEnum'
      type: object
    TipoEnum:
      description: '* `pessoal` - Pessoal

        * `grupo` - Grupo'
      enum:
      - pessoal
      - grupo
      type: string
  securitySchemes:
    AllauthSessionToken:
      description: Session token. Only needed when `client` is equal to `app`.
      in: header
      name: X-Session-Token
      type: apiKey
    cookieAuth:
      in: cookie
      name: sessionid
      type: apiKey
info:
  description: Contas (boletos e Pix) no espaço pessoal e em grupos familiares.
  title: Varal API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/auth/browser/v1/account/email:
    delete:
      description: 'Used to remove an email address.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthEmail'
      responses:
        '200':
          $ref: '#/components/responses/AllauthEmailAddresses'
        '400':
          content:
            application/json:
              examples:
                invalid_code:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
      security:
      - AllauthSessionToken: &id001 []
      - {}
      summary: Remove an email address
      tags:
      - 'Account: Email'
    get:
      description: 'Retrieves the list of email addresses of the account.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthEmailAddresses'
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: List email addresses
      tags:
      - 'Account: Email'
    patch:
      description: 'Used to change primary email address to a different one. Note
        that only verified email addresses

        can be marked as primary.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthMarkPrimaryEmail'
      responses:
        '200':
          $ref: '#/components/responses/AllauthEmailAddresses'
        '400':
          content:
            application/json:
              examples:
                invalid_code:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Change primary email address
      tags:
      - 'Account: Email'
    post:
      description: "The following functionality is available:\n\n  - Adding a new\
        \ email address for an already signed in user (`ACCOUNT_CHANGE_EMAIL = False`).\n\
        \  - Change to a new email address for an already signed in user   (`ACCOUNT_CHANGE_EMAIL\
        \ = True`).\n  - Change to a new email address during the email verification\
        \ process at signup (`ACCOUNT_EMAIL_VERIFICATION_SUPPORTS_CHANGE = True`).\n\
        \nIn all cases, an email verification mail will be sent containing a link\
        \ or code that needs to be verified.\n"
      requestBody:
        $ref: '#/components/requestBodies/AllauthEmail'
      responses:
        '200':
          $ref: '#/components/responses/AllauthEmailAddresses'
        '400':
          content:
            application/json:
              examples:
                invalid_code:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          $ref: '#/components/responses/AllauthAuthenticationOrReauthentication'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. For example, when no user is authenticated and no
            email verification flow is pending.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: 'Add/Change email address

        '
      tags:
      - 'Account: Email'
    put:
      description: 'Requests for (another) email verification email to be sent. Note
        that

        sending emails is rate limited, so when you send too many requests the

        email will not be sent.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthEmail'
      responses:
        '200':
          $ref: '#/components/responses/AllauthStatusOK'
        '400':
          content:
            application/json:
              examples:
                invalid_code:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthForbiddenResponse'
          description: 'Too many email verification mails were already sent.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Request email verification
      tags:
      - 'Account: Email'
  /api/auth/browser/v1/account/password/change:
    post:
      description: 'In order to change the password of an account, the current and
        new

        password must be provider.  However, accounts that were created by

        signing up using a third-party provider do not have a password set. In

        that case, the current password is not required.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthChangePassword'
      responses:
        '400':
          $ref: '#/components/responses/AllauthError'
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Change password
      tags:
      - 'Account: Password'
  /api/auth/browser/v1/account/phone:
    get:
      description: 'Retrieves the phone number of the account, if any. Note that while
        the

        endpoint returns a list of phone numbers, at most one entry is returned.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthPhoneNumbers'
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Get the phone number
      tags:
      - 'Account: Phone'
    post:
      description: "The following functionality is available:\n\n- Initiate the phone\
        \ number change process for signed in users.\n- Change to a new phone number\
        \ during the phone number verification\n  process at signup for unauthenticated\
        \ users. Note that this requires:\n  `ACCOUNT_PHONE_VERIFICATION_SUPPORTS_CHANGE\
        \ = True`.\n\nIn both cases, after posting a new phone number, proceed with\
        \ the phone\nverification endpoint to confirm the change of the phone number\
        \ by\nposting the verification code.\n"
      requestBody:
        $ref: '#/components/requestBodies/AllauthPhone'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthPhoneNumberChangeResponse'
          description: Phone number change process initiated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          $ref: '#/components/responses/AllauthAuthenticationOrReauthentication'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. For example, when no user is authenticated and no
            phone verification flow is pending.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: 'Change the phone number

        '
      tags:
      - 'Account: Phone'
  /api/auth/browser/v1/account/providers:
    delete:
      description: 'Disconnect a third-party provider account, returning the remaining

        accounts that are still connected. The disconnect is not allowed if it

        would leave the account unusable. For example, if no password was

        set up yet.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthProviderAccount'
      responses:
        '200':
          $ref: '#/components/responses/AllauthProviderAccounts'
        '400':
          content:
            application/json:
              examples:
                no_email:
                  $ref: '#/components/examples/AllauthDisconnectNotAllowedNoVerifiedEmail'
                no_password:
                  $ref: '#/components/examples/AllauthDisconnectNotAllowedNoPassword'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: 'Disconnect a third-party provider account

        '
      tags:
      - 'Account: Providers'
    get:
      responses:
        '200':
          $ref: '#/components/responses/AllauthProviderAccounts'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: List the connected third-party provider accounts
      tags:
      - 'Account: Providers'
  /api/auth/browser/v1/auth/code/confirm:
    post:
      description: 'Use this endpoint to pass along the received "special" login code.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthConfirmLoginCode'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticatedByCode'
        '400':
          content:
            application/json:
              examples:
                invalid_code:
                  $ref: '#/components/examples/AllauthInvalidAuthenticatorCode'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          content:
            application/json:
              examples:
                unauthenticated_pending_2fa:
                  $ref: '#/components/examples/AllauthUnauthenticatedPending2FA'
              schema:
                $ref: '#/components/schemas/AllauthAuthenticationResponse'
          description: 'Not authenticated.

            '
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The "login by code" flow is not pending.

            '
      summary: Confirm login code
      tags:
      - 'Authentication: Login By Code'
  /api/auth/browser/v1/auth/email/verify:
    get:
      description: 'Obtain email verification information, given the token that was
        sent to

        the user by email.

        '
      parameters:
      - $ref: '#/components/parameters/AllauthEmailVerificationKey'
      responses:
        '200':
          $ref: '#/components/responses/AllauthEmailVerificationInfo'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmailVerificationKey'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: 'An input error occurred.

            '
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The email verification (by code) flow is not pending.

            '
      summary: Get email verification information
      tags:
      - 'Authentication: Account'
    post:
      description: 'Complete the email verification process. Depending on the configuration,

        email addresses are either verified by opening a link that is sent to

        their email address, or, by inputting a code that is sent. On the API,

        both cases are handled identically. Meaning, the required key is either

        the one from the link, or, the code itself.


        Note that a status code of 401 does not imply failure. It indicates that

        the email verification was successful, yet, the user is still not signed

        in. For example, in case `ACCOUNT_LOGIN_ON_EMAIL_CONFIRMATION` is set to

        `False`, a 401 is returned when verifying as part of login/signup.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthVerifyEmail'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticated'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmailVerificationKey'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: 'An input error occurred.

            '
        '401':
          $ref: '#/components/responses/AllauthUnauthenticated'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The email verification (by code) flow is not pending.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Verify an email
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/email/verify/resend:
    post:
      description: 'Requests a new email verification code.

        Requires `ACCOUNT_EMAIL_VERIFICATION_SUPPORTS_RESEND = True`.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthStatusOK'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The email verification (by code) flow is not pending.

            '
        '429':
          $ref: '#/components/responses/AllauthTooManyRequests'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Resend email verification code
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/login:
    post:
      description: 'Login using a username-password or email-password combination.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthLogin'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticatedByPassword'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmail'
                password_mismatch:
                  $ref: '#/components/examples/AllauthPasswordMismatch'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          content:
            application/json:
              examples:
                pending_2fa:
                  $ref: '#/components/examples/AllauthUnauthenticatedPending2FA'
                pending_email:
                  $ref: '#/components/examples/AllauthUnauthenticatedPendingEmailVerification'
              schema:
                $ref: '#/components/schemas/AllauthAuthenticationResponse'
          description: 'Not authenticated.

            '
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. For example, when logging in when a user is already
            logged in.

            '
      summary: Login
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/password/request:
    post:
      description: 'Initiates the password reset procedure. Depending on whether or
        not

        `ACCOUNT_PASSWORD_RESET_BY_CODE_ENABLED` is `True`, the procedure is

        either stateless or stateful.


        In case codes are used, it is stateful, and a new

        `password_reset_by_code` flow is started. In this case, on a successful

        password reset request, you will receive a 401 indicating the pending

        status of this flow.


        In case password reset is configured to use (stateless) links, you will

        receive a 200 on a successful password reset request.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthRequestPassword'
      responses:
        '200':
          $ref: '#/components/responses/AllauthStatusOK'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: 'An input error occurred.

            '
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
      summary: Request password
      tags:
      - 'Authentication: Password Reset'
  /api/auth/browser/v1/auth/password/reset:
    get:
      description: 'Used to obtain information on and validate a password reset key.  The

        key passed is either the key encoded in the password reset URL that the

        user has received per email, or, the password reset code in case of

        `ACCOUNT_PASSWORD_RESET_BY_CODE_ENABLED`. Note that in case of a code,

        the number of requests you can make is limited (by

        `ACCOUNT_PASSWORD_RESET_BY_CODE_MAX_ATTEMPTS`).

        '
      parameters:
      - $ref: '#/components/parameters/AllauthPasswordResetKey'
      responses:
        '200':
          $ref: '#/components/responses/AllauthPasswordResetInfo'
        '400':
          content:
            application/json:
              examples:
                password_reset_key_invalid:
                  $ref: '#/components/examples/AllauthInvalidPasswordResetKey'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: 'An input error occurred.

            '
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. There is no password reset (by code) flow pending.

            '
      summary: Get password reset information
      tags:
      - 'Authentication: Password Reset'
    post:
      description: 'Perform the password reset, by handing over the password reset
        key and

        the new password. After successfully completing the password reset, the

        user is either logged in (in case `ACCOUNT_LOGIN_ON_PASSWORD_RESET` is

        `True`), or, the user will need to proceed to the login page.  In case

        of the former, a `200` status code is returned, in case of the latter a

        401.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthResetPassword'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticatedByPassword'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. There is no password reset (by code) flow pending.

            '
      summary: Reset password
      tags:
      - 'Authentication: Password Reset'
  /api/auth/browser/v1/auth/phone/verify:
    post:
      description: 'Complete the phone number verification process. Note that a status
        code

        of 401 does not imply failure. It merely indicates that the phone number

        verification was successful, yet, the user is still not signed in.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthVerifyPhone'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticated'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: 'An input error occurred.

            '
        '401':
          $ref: '#/components/responses/AllauthUnauthenticated'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The phone verification flow is not pending.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Verify a phone number
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/phone/verify/resend:
    post:
      description: 'Requests a new phone number verification code.

        Requires `ACCOUNT_PHONE_VERIFICATION_SUPPORTS_RESEND = True`.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthStatusOK'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The phone verification flow is not pending.

            '
        '429':
          $ref: '#/components/responses/AllauthTooManyRequests'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Resend phone number verification code
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/provider/redirect:
    post:
      description: 'Initiates the third-party provider authentication redirect flow.
        As calling

        this endpoint results in a user facing redirect (302), this call is only

        available in a browser, and must be called in a synchronous (non-XHR)

        manner.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthProviderRedirect'
      responses:
        '302':
          description: The provider authorization URL to which the client should be
            redirected.
          headers:
            location:
              description: The redirect URL.
              schema:
                type: string
      summary: Provider redirect
      tags:
      - 'Authentication: Providers'
  /api/auth/browser/v1/auth/provider/signup:
    get:
      description: 'If, while signing up using a third-party provider account, there
        is

        insufficient information received from the provider to automatically

        complete the signup process, an additional step is needed to complete

        the missing data before the user is fully signed up and authenticated.

        The information available so far, such as the pending provider account,

        can be retrieved via this endpoint.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthProviderSignup'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The provider signup flow is not pending.

            '
      summary: Provider signup information
      tags:
      - 'Authentication: Providers'
    post:
      description: 'If, while signing up using a third-party provider account, there
        is

        insufficient information received from the provider to automatically

        complete the signup process, an additional step is needed to complete

        the missing data before the user is fully signed up and authenticated.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthProviderSignup'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticated'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          content:
            application/json:
              examples:
                unauthenticated_pending_email_verification:
                  $ref: '#/components/examples/AllauthUnauthenticatedPendingEmailVerification'
              schema:
                $ref: '#/components/schemas/AllauthAuthenticationResponse'
          description: Not authenticated, more steps are required to be completed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthForbiddenResponse'
          description: 'Forbidden. For example, when signup is closed.

            '
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The provider signup flow is not pending.

            '
      summary: Provider signup
      tags:
      - 'Authentication: Providers'
  /api/auth/browser/v1/auth/provider/token:
    post:
      description: 'Authenticates with a third-party provider using provider tokens
        received

        by other means. For example, in case of a mobile app, the authentication

        flow runs completely on the device itself, without any interaction with

        the API. Then, when the (device) authentication completes and the mobile

        app receives an access and/or ID token, it can hand over these tokens

        via this endpoint to authenticate on the server.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthProviderToken'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticated'
        '400':
          content:
            application/json:
              examples:
                invalid_token:
                  $ref: '#/components/examples/AllauthInvalidProviderToken'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          content:
            application/json:
              examples:
                unauthenticated_pending_2fa:
                  $ref: '#/components/examples/AllauthUnauthenticatedPending2FA'
                unauthenticated_pending_email_verification:
                  $ref: '#/components/examples/AllauthUnauthenticatedPendingEmailVerification'
              schema:
                $ref: '#/components/schemas/AllauthAuthenticationResponse'
          description: Not authenticated, more steps are required to be completed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthForbiddenResponse'
          description: 'Forbidden. For example, when signup is closed.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Provider token
      tags:
      - 'Authentication: Providers'
  /api/auth/browser/v1/auth/reauthenticate:
    post:
      description: 'In order to safeguard the account, some actions require the user
        to be

        recently authenticated.  If you try to perform such an action without

        having been recently authenticated, a `401` status is returned, listing

        flows that can be performed to reauthenticate. One such flow is the flow

        with ID `reauthenticate`, which allows for the user to input the

        password. This is the endpoint related towards that flow.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthReauthenticate'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticatedByPassword'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthIncorrectPassword'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '403':
          $ref: '#/components/responses/AllauthForbidden'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Reauthenticate
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/reauthenticate/code/confirm:
    post:
      description: 'Complete the pending `reauthenticate_by_code` flow using the code
        sent

        to the selected email address or phone number.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthConfirmLoginCode'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticatedByCode'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
        '403':
          $ref: '#/components/responses/AllauthForbidden'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The reauthentication by code flow is not pending.

            '
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Confirm a reauthentication code
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/reauthenticate/code/request:
    post:
      description: 'Send a reauthentication code to one of the verified email addresses
        or

        the verified phone number listed on the `reauthenticate_by_code` flow.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthRequestReauthenticationCode'
      responses:
        '200':
          $ref: '#/components/responses/AllauthStatusOK'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: An input error occurred.
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
        '403':
          $ref: '#/components/responses/AllauthForbidden'
        '429':
          $ref: '#/components/responses/AllauthTooManyRequests'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Request a reauthentication code
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/reauthenticate/code/resend:
    post:
      description: 'Send a new code for the pending `reauthenticate_by_code` flow.

        Requires `ACCOUNT_LOGIN_BY_CODE_SUPPORTS_RESEND` to be enabled.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthStatusOK'
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
        '403':
          $ref: '#/components/responses/AllauthForbidden'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. The reauthentication by code flow is not pending
            or can

            no longer be resent.

            '
        '429':
          $ref: '#/components/responses/AllauthTooManyRequests'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Resend a reauthentication code
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/auth/session:
    delete:
      description: 'Logs out the user from the current session.

        '
      responses:
        '401':
          $ref: '#/components/responses/AllauthUnauthenticated'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: Logout
      tags:
      - 'Authentication: Current Session'
    get:
      description: 'Retrieve information about the authentication status for the current

        session.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticated'
        '401':
          $ref: '#/components/responses/AllauthAuthentication'
        '410':
          $ref: '#/components/responses/AllauthSessionGone'
      security:
      - AllauthSessionToken: *id001
      - {}
      summary: 'Get authentication status

        '
      tags:
      - 'Authentication: Current Session'
  /api/auth/browser/v1/auth/signup:
    post:
      description: 'Whether or not `username`, `email`, `phone` or combination of
        those are

        required depends on the configuration of django-allauth. Additionally,

        if a custom signup form is used there may be other custom properties

        required.

        '
      requestBody:
        $ref: '#/components/requestBodies/AllauthSignup'
      responses:
        '200':
          $ref: '#/components/responses/AllauthAuthenticatedByPassword'
        '400':
          content:
            application/json:
              examples:
                invalid_email:
                  $ref: '#/components/examples/AllauthInvalidEmail'
              schema:
                $ref: '#/components/schemas/AllauthErrorResponse'
          description: 'An input error occurred.

            '
        '401':
          content:
            application/json:
              examples:
                pending_email:
                  $ref: '#/components/examples/AllauthUnauthenticatedPendingEmailVerification'
              schema:
                $ref: '#/components/schemas/AllauthAuthenticationResponse'
          description: 'Not authenticated.

            '
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthForbiddenResponse'
          description: 'Forbidden. For example, when signup is closed.

            '
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllauthConflictResponse'
          description: 'Conflict. For example, when signing up while user is logged
            in.

            '
      summary: Signup
      tags:
      - 'Authentication: Account'
  /api/auth/browser/v1/config:
    get:
      description: 'There are many configuration options that alter the functionality

        and behavior of django-allauth, some of which can also impact the

        frontend. Therefore, relevant configuration options are exposed via

        this endpoint. The data returned is not user/authentication

        dependent. Hence, it suffices to only fetch this data once at boot

        time of your application.

        '
      responses:
        '200':
          $ref: '#/components/responses/AllauthConfiguration'
      summary: Get configuration
      tags:
      - Configuration
