worker_processes 1;
error_log /dev/null crit;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    map $upstream_http_referrer_policy $varal_referrer { "" no-referrer; default $upstream_http_referrer_policy; }
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    server_tokens off;
    map $http_host $allowed_web_host {
        default 0;
        ~^varal\.local(?::[0-9]+)?$ 1;
    }
    map $http_host $allowed_s3_host {
        default 0;
        ~^s3\.varal\.local(?::[0-9]+)?$ 1;
    }
    server {
        listen 8443 ssl default_server;
        ssl_certificate /run/lab-tls/cert.pem;
        ssl_certificate_key /run/lab-tls/key.pem;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name varal.local;
        ssl_certificate /run/lab-tls/cert.pem;
        ssl_certificate_key /run/lab-tls/key.pem;
        if ($allowed_web_host = 0) { return 421; }
        # COR-12: the app (Next) owns the policy per page; the edge only fills the default.
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy $varal_referrer always;
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host varal.local;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host varal.local;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host varal.local;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host varal.local;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }
    }
    server {
        listen 8443 ssl;
        server_name s3.varal.local;
        ssl_certificate /run/lab-tls/cert.pem;
        ssl_certificate_key /run/lab-tls/key.pem;
        if ($allowed_s3_host = 0) { return 421; }
        location / {
            proxy_pass http://storage:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
