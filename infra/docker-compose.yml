name: varal

x-api: &api
  build: ../api
  env_file: .env
  volumes: ["../api:/app", "pdfspool:/varal/staging", "./scripts/api-entrypoint.sh:/varal/entrypoint.sh:ro"]
  entrypoint: ["/bin/sh", "/varal/entrypoint.sh"]
  environment:
    PDF_SPOOL_DIR: /varal/staging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    storage-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      WEBPUSH_PRIVATE_KEY: ""
      NOTIFICACOES_STORAGE_KEY: ""
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  minio:
    # Local-only S3 (ADR 0002): pgsty/silo, the continuation of pgsty/minio, same API and MINIO_*
    # vars. Pinned release, never `latest`.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address :9001
    env_file: .env
    environment:
      WEBPUSH_PRIVATE_KEY: ""
      NOTIFICACOES_STORAGE_KEY: ""
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-init:
    build: ../api
    env_file: .env
    environment:
      WEBPUSH_PRIVATE_KEY: ""
      NOTIFICACOES_STORAGE_KEY: ""
    volumes: ["./scripts/api-entrypoint.sh:/varal/entrypoint.sh:ro"]
    entrypoint: ["/bin/sh", "/varal/entrypoint.sh"]
    depends_on:
      minio: { condition: service_healthy }
    command: python manage.py preparar_storage
    restart: "no"

  api:
    <<: *api
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    environment:
      PDF_SPOOL_DIR: /varal/staging
      WEBPUSH_PRIVATE_KEY: ""
      # Only `make e2e` sets it; empty keeps allauth's signup limit (P5).
      ACCOUNT_RATE_LIMIT_SIGNUP: ${ACCOUNT_RATE_LIMIT_SIGNUP:-}

  worker:
    <<: *api
    environment:
      PDF_SPOOL_DIR: /varal/staging
      # Only the worker receives the private VAPID key from the local env.
      WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
    command: celery -A config worker -l info

  beat:
    <<: *api
    environment:
      PDF_SPOOL_DIR: /varal/staging
      WEBPUSH_PRIVATE_KEY: ""
      NOTIFICACOES_STORAGE_KEY: ""
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  web:
    build: ../web
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes: ["../web:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on: [api]

  # Explicit opt-in; no published ports and no external SMTP relay. For synthetic .invalid
  # recipients only. The captured message stays in this disposable container's /tmp.
  smtp-capture:
    profiles: [smtp-test]
    image: python:3.12-slim
    command: ["python", "/capture/smtp-capture.py"]
    volumes: ["./scripts/smtp-capture.py:/capture/smtp-capture.py:ro"]
    read_only: true
    tmpfs: ["/tmp:mode=0700"]

volumes:
  pgdata:
  miniodata:
  pdfspool:
