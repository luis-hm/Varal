name: varal

x-api: &api
  build: ../api
  env_file: .env
  volumes: ["../api:/app"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  minio:
    # Official minio/minio images are no longer published (Docker Hub and quay.io). Image choice is
    # pending approval (docs/PROGRESSO.md, "Decisões pendentes"); until then the service is opt-in:
    # `docker compose --profile storage up`. Needed from stage 06 on.
    profiles: ["storage"]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    <<: *api
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *api
    command: celery -A config worker -l info

  beat:
    <<: *api
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  web:
    build: ../web
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes: ["../web:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
