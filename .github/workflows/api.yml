name: api

on:
  push:
    paths: ["api/**", "web/src/types/**", "infra/**", "Makefile", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "web/src/types/**", "infra/**", "Makefile", ".github/workflows/api.yml"]
  # Manual run: `gh workflow run api.yml --ref <branch>` (path filters do not apply).
  workflow_dispatch:
  workflow_call:

env:
  DJANGO_DEBUG: "1"
  POSTGRES_HOST: localhost
  POSTGRES_PASSWORD: varal

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: varal-pdfs
      AWS_ACCESS_KEY_ID: varal-ci
      AWS_SECRET_ACCESS_KEY: varal-ci-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: varal
          POSTGRES_USER: varal
          POSTGRES_PASSWORD: varal
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Verify encrypted WAL witness
        run: uv run --frozen python -m unittest discover -s ../infra/wal -p 'test_*.py' -v
      - name: Start private S3 for integration tests
        working-directory: .
        run: sh infra/scripts/ci-storage.sh
      - run: uv run python manage.py preparar_storage
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Run API tests without publishing raw request data
        run: |
          if uv run pytest -q > "$RUNNER_TEMP/varal-api-test-raw.log" 2>&1; then
            echo "API tests passed"
          else
            echo "API tests failed; reproduce locally for details" >&2
            rm -f "$RUNNER_TEMP/varal-api-test-raw.log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/varal-api-test-raw.log"

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
        working-directory: api
      - run: uv run python manage.py export_schema --file openapi.yaml
        working-directory: api
      - run: npm ci && npm run types
        working-directory: web
      - name: Fail if generated schema or types differ from the commit
        run: git diff --exit-code api/openapi.yaml web/src/types/api.ts

  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify journal protocol and recovery
        run: make lab11-journal-test
      - name: Verify journal container and isolated volumes
        run: make lab11-journal-container
      - name: Verify isolated TLS proxy contract
        run: make lab11-proxy-smoke
