name: web

on:
  # develop/main run these through deploy-hmg/deploy-prod; a direct trigger there doubled the minutes.
  push:
    branches-ignore: [develop, main]
    # Browser authentication tests exercise both sides of the same-origin proxy.
    paths: ["web/**", "api/**", "infra/**", "Makefile", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "api/**", "infra/**", "Makefile", ".github/workflows/web.yml"]
  # Manual run: `gh workflow run web.yml --ref <branch>` (path filters do not apply).
  workflow_dispatch:
  workflow_call:
    inputs:
      rapido:
        description: "Skip the browser E2E (~14 min); deploy-hmg uses it to stay under 5 min"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run web unit tests without publishing raw request data
        run: |
          if npm test > "$RUNNER_TEMP/varal-web-test-raw.log" 2>&1; then
            echo "Web tests passed"
          else
            echo "Web tests failed; reproduce locally for details" >&2
            rm -f "$RUNNER_TEMP/varal-web-test-raw.log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/varal-web-test-raw.log"

  e2e:
    # Runs on pull requests, by hand and before production; not on every homologation deploy.
    if: ${{ !inputs.rapido }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_DB: varal
      POSTGRES_USER: varal
      POSTGRES_PASSWORD: varal
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8000
      API_INTERNAL_URL: http://localhost:8000
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: varal-pdfs
      AWS_ACCESS_KEY_ID: varal-ci
      AWS_SECRET_ACCESS_KEY: varal-ci-password
      # The suite signs up ~40 accounts from one IP; allauth's default is 20/m/ip (P5).
      ACCOUNT_RATE_LIMIT_SIGNUP: 1000/m/ip
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: varal
          POSTGRES_USER: varal
          POSTGRES_PASSWORD: varal
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv sync --frozen
        working-directory: api
      - name: Start disposable Redis for E2E
        working-directory: .
        run: |
          redis_id=$(docker run -d --network host --read-only --tmpfs /data \
            --label com.docker.compose.project=varal \
            --label com.docker.compose.service=redis-e2e \
            --label br.varal.e2e.rn31=isolated \
            redis:7-alpine redis-server --bind 127.0.0.1 --save '' --appendonly no)
          echo "E2E_RN31_REDIS_CONTAINER=$redis_id" >> "$GITHUB_ENV"
          echo 'E2E_RN31_ISOLATED=1' >> "$GITHUB_ENV"
          echo 'E2E_RN31_PROJECT=varal' >> "$GITHUB_ENV"
          echo 'E2E_RN31_SERVICE=redis-e2e' >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            docker exec "$redis_id" redis-cli ping | grep -qx PONG && exit 0
            sleep 1
          done
          exit 1
      - name: Start private S3 for PDF integration
        working-directory: .
        run: sh infra/scripts/ci-storage.sh
      - name: Start the real API
        working-directory: api
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py preparar_storage
          uv run celery -A config worker -l warning --concurrency=1 > "$RUNNER_TEMP/varal-worker.log" 2>&1 &
          uv run python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/varal-api.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors --retry-max-time 60 http://localhost:8000/api/health/ > /dev/null
      - name: Run browser tests without publishing raw request data
        run: |
          if npm run e2e -- --workers=1 > "$RUNNER_TEMP/varal-e2e-raw.log" 2>&1; then
            echo "Browser tests passed"
          else
            echo "Browser tests failed; reproduce locally for details" >&2
            rm -f "$RUNNER_TEMP/varal-e2e-raw.log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/varal-e2e-raw.log"
      - name: Build production web
        run: npm run build
      - name: Start production web
        run: |
          ./node_modules/.bin/next start > "$RUNNER_TEMP/varal-web-production.log" 2>&1 &
          production_pid=$!
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors --retry-max-time 60 http://localhost:3000/entrar > /dev/null
          kill -0 "$production_pid"
      - name: Verify production HTTP responses without publishing raw request data
        run: |
          if npm run e2e -- --config=playwright.production.config.ts > "$RUNNER_TEMP/varal-production-e2e-raw.log" 2>&1; then
            echo "Production HTTP tests passed"
          else
            echo "Production HTTP tests failed; reproduce locally for details" >&2
            rm -f "$RUNNER_TEMP/varal-production-e2e-raw.log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/varal-production-e2e-raw.log"
      - name: Remove raw test reports and service logs
        if: always()
        run: |
          rm -rf playwright-report test-results
          rm -f "$RUNNER_TEMP/varal-api.log" "$RUNNER_TEMP/varal-worker.log" "$RUNNER_TEMP/varal-web-production.log"
          if [ -n "${E2E_RN31_REDIS_CONTAINER:-}" ]; then
            docker rm -f "$E2E_RN31_REDIS_CONTAINER" >/dev/null
          fi
