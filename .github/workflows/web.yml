name: web

on:
  push:
    # Browser authentication tests exercise both sides of the same-origin proxy.
    paths: ["web/**", "api/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "api/**", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_DB: varal
      POSTGRES_USER: varal
      POSTGRES_PASSWORD: varal
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8000
      API_INTERNAL_URL: http://localhost:8000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: varal
          POSTGRES_USER: varal
          POSTGRES_PASSWORD: varal
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv sync --frozen
        working-directory: api
      - name: Start the real API
        working-directory: api
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/varal-api.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors --retry-max-time 60 http://localhost:8000/api/health/ > /dev/null
      - run: npm run e2e
      - name: Build production web
        run: npm run build
      - name: Start production web
        run: |
          ./node_modules/.bin/next start > "$RUNNER_TEMP/varal-web-production.log" 2>&1 &
          production_pid=$!
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors --retry-max-time 60 http://localhost:3000/entrar > /dev/null
          kill -0 "$production_pid"
      - name: Verify production HTTP responses
        run: npm run e2e -- --config=playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            ${{ runner.temp }}/varal-api.log
            ${{ runner.temp }}/varal-web-production.log
          retention-days: 7
